server {
    listen 80;
    server_name ffax.com www.ffax.com 104.194.94.140;
    return 301 https://www.ffax.com$request_uri;
}

server {
    listen 443 ssl;
    server_name ffax.com 104.194.94.140;
    ssl_certificate /etc/letsencrypt/live/ffax.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ffax.com-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://www.ffax.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.ffax.com;

    ssl_certificate /etc/letsencrypt/live/ffax.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ffax.com-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/ffax/workspace/dist-root;
    index index.html;

    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    location = / {
        try_files /index.html =404;
    }

    location = /home-1.html {
        return 301 https://www.ffax.com/;
    }

    location ~ ^/(?:\.well-known(?:/|$)|oauth(?:/|$)|oidc(?:/|$)|saml(?:/|$)|v2(?:/|$)|ui/(?:v2/login|console)(?:/|$)|admin(?:/|$)|management(?:/|$)|auth(?:/|$)|zitadel\.) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
    }

    location = /workbench-api {
        proxy_pass http://127.0.0.1:8000/api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /workbench-api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /marketplace-api {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /marketplace-api/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
    }

    location ^~ /sync-api/ {
        proxy_pass http://127.0.0.1:8300/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
    }

    location ^~ /integration-api/warehouse/ {
        proxy_pass http://127.0.0.1:9101/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /integration-api/marketplace/ {
        proxy_pass http://127.0.0.1:9102/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /integration-api/logistics/ {
        proxy_pass http://127.0.0.1:9103/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /integration-api/commerce/ {
        proxy_pass http://127.0.0.1:9104/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf|eot|json|webm|mp4)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location ^~ /workbench/ {
        alias /var/www/ffax/workspace/dist/;
        try_files $uri $uri/ /workbench/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
