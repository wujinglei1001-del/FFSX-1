name: ffax-secrets

services:
  openbao:
    image: quay.io/openbao/openbao:2.6.1
    restart: unless-stopped
    cap_add: [IPC_LOCK]
    command: ["server", "-config=/openbao/config/openbao.hcl"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    volumes:
      - ./openbao.hcl:/openbao/config/openbao.hcl:ro
      - openbao-data:/openbao/data
    healthcheck:
      test: ["CMD-SHELL", "bao status >/dev/null 2>&1; code=$$?; [ $$code -eq 0 ] || [ $$code -eq 2 ]"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [ffax-secrets]

networks:
  ffax-secrets:
    name: ffax-secrets
    internal: true

volumes:
  openbao-data:

